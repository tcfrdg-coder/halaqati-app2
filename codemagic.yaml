workflows:
  halaqati-android:
    name: Halaqati - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      vars:
        # يفشل البناء بدل أن يُنتج تطبيقاً يحتاج إنترنت إذا تعذّر تحميل أي مكتبة
        REQUIRE_OFFLINE: "true"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare web files (bundle libraries for offline use)
        script: node scripts/prepare-www.js
      - name: Add Android platform
        script: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Generate launcher icon and splash screen
        script: npx capacitor-assets generate --android
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
