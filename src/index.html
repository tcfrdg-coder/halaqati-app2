                                                <p className="font-black text-emerald-900" style={{ fontSize: '22px', marginTop: '2px' }}>{exportRow.student.name}</p>
                                            </div>
                                            <Icon name="user-circle" size={44} className="text-emerald-600" />
                                        </div>
                                        <div className="grid grid-cols-4 gap-3 mb-3">
                                            <ExportStatBox label="إجمالي الأيام" value={exportRow.totalDays} color="bg-gray-100 text-gray-700" icon="calendar" />
                                            <ExportStatBox label="حضور" value={exportRow.presentCount} color="bg-emerald-100 text-emerald-700" icon="check-circle" />
                                            <ExportStatBox label="تأخر" value={exportRow.lateCount} color="bg-amber-100 text-amber-700" icon="clock" />
                                            <ExportStatBox label="غياب بعذر" value={exportRow.excusedCount} color="bg-orange-100 text-orange-700" icon="alert-circle" />
                                        </div>
                                        <div className="grid grid-cols-3 gap-3 mb-6">
                                            <ExportStatBox label="غياب بدون عذر" value={exportRow.absentCount} color="bg-red-100 text-red-700" icon="x-circle" />
                                            <ExportStatBox label="صفحات الحفظ" value={exportRow.hifzTotal} color="bg-gradient-to-br from-emerald-600 to-emerald-800 text-white" icon="bookmark" />
                                            <ExportStatBox label="صفحات المراجعة" value={exportRow.reviewTotal} color="bg-gradient-to-br from-teal-600 to-teal-800 text-white" icon="repeat" />
                                        </div>
                                        {studentKashfType === 'detailed' && (
                                            <React.Fragment>
                                                <p className="font-black text-gray-600 avoid-break" style={{ fontSize: '15px', marginBottom: '10px' }}>السجل اليومي التفصيلي</p>
                                                <div style={{ border: '1px solid #a7f3d0', borderRadius: '16px', overflow: 'hidden' }}>
                                                    <table className="w-full text-center" style={{ borderCollapse: 'collapse', fontSize: '13px' }}>
                                                        <thead>
                                                            <tr className="bg-emerald-700 text-white">
                                                                <th className="p-3 font-black" style={{ width: '16%' }}>التاريخ</th>
                                                                <th className="p-3 font-black" style={{ width: '13%' }}>الحالة</th>
                                                                <th className="p-3 font-black" style={{ width: '27%' }}>الحفظ</th>
                                                                <th className="p-3 font-black" style={{ width: '27%' }}>المراجعة</th>
                                                                <th className="p-3 font-black" style={{ width: '17%' }}>التقييم</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {studentDayLog.length === 0 && (
                                                                <tr><td colSpan="5" className="p-6 text-gray-400">لا يوجد سجلات ضمن هذه الفترة</td></tr>
                                                            )}
                                                            {studentDayLog.map((entry, i) => (
                                                                <tr key={entry.date} className={i % 2 === 0 ? 'bg-white' : 'bg-emerald-50'}>
                                                                    <td className="p-3 border-t border-emerald-100 font-bold text-gray-500" dir="ltr">{entry.date}</td>
                                                                    <td className={`p-3 border-t border-emerald-100 font-bold ${entry.status === 'present' ? 'text-emerald-700' : entry.status === 'late' ? 'text-amber-600' : entry.status === 'absent_excused' ? 'text-orange-600' : 'text-red-600'}`}>{statusLabel(entry.status)}</td>
                                                                    <td className="p-3 border-t border-emerald-100 text-gray-700">{entry.hifzLine}</td>
                                                                    <td className="p-3 border-t border-emerald-100 text-gray-700">{entry.reviewLine}</td>
                                                                    <td className="p-3 border-t border-emerald-100 text-gray-500">{entry.rating}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </ExportFrame>
                                </div>
                            )}

                            {exportJob.kind === 'points' && (
                                <div ref={pointsExportRef}>
                                    <ExportFrame title="تقرير النقاط" chip="أرصدة الطلاب" periodText={`حتى تاريخ: ${new Date().toLocaleDateString('ar-EG-u-nu-latn')}`}>
                                        <div className="grid grid-cols-3 gap-3 mb-6">
                                            <ExportStatBox label="عدد الطلاب" value={pointsRows.length} color="bg-gray-100 text-gray-700" icon="users" />
                                            <ExportStatBox label="إجمالي نقاط الحلقة" value={pointsTotal} color="bg-gradient-to-br from-emerald-600 to-emerald-800 text-white" icon="award" />
                                            <ExportStatBox label="أعلى رصيد" value={pointsMax} color="bg-amber-100 text-amber-700" icon="trophy" sub={pointsTop ? pointsTop.student.name : ''} />
                                        </div>
                                        <div style={{ border: '1px solid #a7f3d0', borderRadius: '16px', overflow: 'hidden' }}>
                                            <table className="w-full" style={{ borderCollapse: 'collapse', fontSize: '14px' }}>
                                                <thead>
                                                    <tr className="bg-emerald-700 text-white">
                                                        <th className="p-3 font-black text-center" style={{ width: '7%' }}>#</th>
                                                        <th className="p-3 font-black text-right" style={{ width: '33%' }}>الطالب</th>
                                                        <th className="p-3 font-black text-right" style={{ width: '40%' }}>الرصيد</th>
                                                        <th className="p-3 font-black text-center" style={{ width: '20%' }}>النقاط</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {pointsRows.length === 0 && (
                                                        <tr><td colSpan="4" className="p-6 text-center text-gray-400">لا يوجد طلاب مضافين حالياً</td></tr>
                                                    )}
                                                    {pointsRows.map((pr, i) => (
                                                        <tr key={pr.student.id} className={i % 2 === 0 ? 'bg-white' : 'bg-emerald-50'}>
                                                            <td className="p-3 border-t border-emerald-100 text-center font-bold text-gray-400">{i + 1}</td>
                                                            <td className="p-3 border-t border-emerald-100 font-black text-emerald-900 text-right">{pr.student.name}</td>
                                                            <td className="p-3 border-t border-emerald-100">
                                                                <div style={{ height: '10px', borderRadius: '999px', background: '#e5e7eb', overflow: 'hidden' }}>
                                                                    <div style={{ height: '10px', borderRadius: '999px', background: pr.points < 0 ? '#ef4444' : '#10b981', width: `${pointsMax > 0 ? Math.max(0, Math.min(100, (pr.points / pointsMax) * 100)) : 0}%` }}></div>
                                                                </div>
                                                            </td>
                                                            <td className={`p-3 border-t border-emerald-100 text-center font-black ${pr.points < 0 ? 'text-red-600' : 'text-emerald-700'}`}>{pr.points}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                                {pointsRows.length > 0 && (
                                                    <tfoot>
                                                        <tr className="bg-emerald-100 font-black">
                                                            <td className="p-3 border-t-2 border-emerald-400" colSpan="3">إجمالي نقاط الحلقة</td>
                                                            <td className="p-3 border-t-2 border-emerald-400 text-center text-emerald-800">{pointsTotal}</td>
                                                        </tr>
                                                    </tfoot>
                                                )}
                                            </table>
                                        </div>
                                    </ExportFrame>
                                </div>
                            )}
                        </div>
                    )}

                    {!termsOk && (
                        <div className="fixed inset-0 bg-black/70 z-[300] flex items-end sm:items-center justify-center p-3 no-print">
                            <div className="bg-white rounded-3xl w-full max-w-md max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="p-5 pb-3 text-center border-b border-gray-100">
                                    <Logo size={56} className="mx-auto mb-2" />
                                    <h3 className="font-black text-emerald-900 text-lg">مرحباً بك في حَلَقَتي</h3>
                                    <p className="text-[11px] font-bold text-gray-400 mt-1">يرجى قراءة شروط الاستخدام والترخيص قبل البدء</p>
                                </div>
                                <div className="p-5 overflow-y-auto space-y-3">
                                    <TermsParties />
                                    {TERMS_SECTIONS.map((s, i) => (
                                        <div key={s.h} className="flex gap-3 items-start">
                                            <span className="shrink-0 w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-black flex items-center justify-center">{i + 1}</span>
                                            <div>
                                                <h4 className="font-black text-emerald-800 text-[13px] mb-0.5">{s.h}</h4>
                                                <p className="text-[13px] text-gray-700 leading-6 font-medium">{s.p}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 border-t border-gray-100">
                                    <button onClick={acceptTerms} className="w-full bg-emerald-600 text-white font-black py-3.5 rounded-2xl shadow-md">أوافق على هذه الشروط وأتابع</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* الدرج الجانبي (يمين الشاشة) - خفيف ومنظّم: الشعار، بطاقة الحلقة، ثم القائمة */}
                    {showDrawer && (
                        <div onClick={() => setShowDrawer(false)} className="fixed inset-0 bg-black/40 z-[105] no-print"></div>
                    )}
                    <div className={`fixed top-0 right-0 h-full w-72 max-w-[82%] bg-white z-[110] shadow-2xl transform transition-transform duration-300 flex flex-col no-print ${showDrawer ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex items-center justify-between px-4 pt-4 pb-3">
                            <div className="flex items-center gap-2">
                                <Logo size={32} />
                                <span className="font-black text-emerald-800 text-base">حَلَقَتي</span>
                            </div>
                            <button onClick={() => setShowDrawer(false)} aria-label="إغلاق" className="p-2 rounded-full text-gray-400 hover:bg-gray-100">
                                <Icon name="x" size={18} />
                            </button>
                        </div>

                        <div onClick={() => { setActiveTab('profile'); setSelectedStudentId(null); setShowDrawer(false); }} className="mx-4 mb-2 rounded-2xl border border-emerald-100 bg-emerald-50/60 p-3 flex items-center gap-3 cursor-pointer">
                            <div className="shrink-0 w-11 h-11 rounded-full bg-emerald-600 text-white flex items-center justify-center font-black text-lg">
                                {(settings.halakaName || 'ح').trim().charAt(0)}
                            </div>
                            <div className="min-w-0 flex-1">
                                <p className="font-black text-gray-800 text-sm truncate">{settings.halakaName}</p>
                                <p className="text-[11px] font-bold text-gray-500 truncate">بإشراف: {settings.teacherName}</p>
                            </div>
                            <button
                                onClick={() => { setActiveTab('profile'); setSelectedStudentId(null); setShowDrawer(false); }}
                                aria-label="الملف الشخصي"
                                className="shrink-0 p-2 rounded-lg text-emerald-700 hover:bg-emerald-100"
                            >
                                <Icon name="chevron-left" size={16} />
                            </button>
                        </div>

                        <div className="px-3 space-y-1 flex-1 overflow-y-auto">
                            {[
                                { id: 'profile', icon: 'user-circle', label: 'الملف الشخصي', sec: 'حلقتي' },
                                { id: 'settings', icon: 'database', label: 'النسخ الاحتياطي والبيانات' },
                                { id: 'guide', icon: 'compass', label: 'دليل البدء', sec: 'المساعدة' },
                                { id: 'about', icon: 'info', label: 'حول التطبيق', sec: 'معلومات' },
                                { id: 'terms', icon: 'file-text', label: 'شروط الاستخدام والترخيص' },
                            ].map(item => (
                                <React.Fragment key={item.id}>
                                {item.sec && <p className="text-[10px] font-black text-gray-400 px-3 pt-3 pb-1">{item.sec}</p>}
                                <button
                                    onClick={() => { setActiveTab(item.id); setSelectedStudentId(null); setShowDrawer(false); }}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${activeTab === item.id ? 'bg-emerald-50 text-emerald-700' : 'text-gray-700 hover:bg-gray-50'}`}
                                >
                                    <span className={`shrink-0 w-8 h-8 rounded-lg flex items-center justify-center ${activeTab === item.id ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-50 text-gray-500'}`}>
                                        <Icon name={item.icon} size={16} />
                                    </span>
                                    <span className="flex-1 text-right">{item.label}</span>
                                    <Icon name="chevron-left" size={14} className="text-gray-300" />
                                </button>
                                </React.Fragment>
                            ))}
                        </div>

                        <div className="mx-4 mb-2 mt-2">
                            <p className="text-[10px] font-bold text-gray-400 mb-1.5 px-1">مظهر التطبيق</p>
                            <div className="grid grid-cols-2 gap-1 bg-gray-100 rounded-xl p-1">
                                {[['light', '☀️ نهاري'], ['dark', '🌙 ليلي']].map(([k, l]) => (
                                    <button key={k} onClick={() => setTheme(k)} className={`py-1.5 rounded-lg text-[11px] font-black transition-colors ${theme === k ? 'bg-emerald-600 text-white shadow-sm' : 'text-gray-500'}`}>{l}</button>
                                ))}
                            </div>
                        </div>
                        <div className="px-4 py-3 text-center border-t border-gray-100 space-y-1">
                            <div className="flex items-center justify-center gap-1.5"><Logo size={18} /><span className="text-[11px] font-black text-gray-500">حَلَقَتي</span><span className="text-[10px] font-bold text-gray-400" dir="ltr">v{APP_VERSION}</span></div>
                            <p className="text-[10px] text-gray-400 font-bold">الجهة المستخدمة: {LICENSEE}</p>
                            <p className="text-[10px] text-gray-300 font-bold">تطوير: {OWNER} · © {new Date().getFullYear()}</p>
                        </div>
                    </div>

                    {/* نافذة تأكيد إعادة الضبط - تأكيد مشدّد لأن الإجراء نهائي ولا يمكن التراجع عنه */}
                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                <div className="flex flex-col items-center text-center gap-2">
                                    <div className="bg-red-100 text-red-600 p-3 rounded-full">
                                        <Icon name="alert-triangle" size={28} />
                                    </div>
                                    <h3 className="font-black text-red-700 text-lg">تأكيد إعادة الضبط</h3>
                                    <p className="text-xs text-gray-500 leading-relaxed">
                                        سيتم حذف <span className="font-black text-red-600">كل التسجيلات اليومية</span> ({sessions.length} يوم مسجّل حالياً) بشكل نهائي، ولا يمكن التراجع عن هذا الإجراء أبداً.
                                        <br /><br />
                                        <span className="font-bold text-gray-600">لن يتم حذف:</span> أسماء الطلاب، أرصدة النقاط، أو إعدادات الحلقة.
                                    </p>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold text-gray-400 block px-1">للتأكيد، اكتب كلمة "حذف" في الحقل بالأسفل:</label>
                                    <input 
                                        value={resetConfirmText}
                                        onChange={(e) => setResetConfirmText(e.target.value)}
                                        className="w-full bg-gray-50 border-2 border-red-100 rounded-2xl p-3 text-center font-black text-red-700 focus:ring-1 focus:ring-red-400"
                                        placeholder="حذف"
                                        dir="rtl"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {setShowResetModal(false); setResetConfirmText('');}} 
                                        className="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-2xl"
                                    >
                                        إلغاء
                                    </button>
                                    <button 
                                        disabled={resetConfirmText.trim() !== 'حذف'}
                                        onClick={performFullReset}
                                        className={`flex-1 font-black py-3 rounded-2xl text-white transition-all ${resetConfirmText.trim() === 'حذف' ? 'bg-red-600 shadow-lg shadow-red-200' : 'bg-red-200 cursor-not-allowed'}`}
                                    >
                                        حذف نهائياً
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة تصفح سجل الأيام السابقة */}
                    {showSessionHistory && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-4 no-print" onClick={() => setShowSessionHistory(false)}>
                            <div className="bg-white rounded-3xl p-5 max-w-sm w-full max-h-[75vh] flex flex-col shadow-2xl" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-gray-800 flex items-center gap-2">
                                        <Icon name="calendar" size={18} className="text-emerald-600" /> سجل الأيام السابقة
                                    </h3>
                                    <button onClick={() => setShowSessionHistory(false)} className="text-gray-400 p-1">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="overflow-y-auto space-y-2 flex-1">
                                    {sessionDatesSorted.length === 0 && (
                                        <p className="text-center text-xs text-gray-400 py-8">لا توجد أي أيام مسجلة بعد</p>
                                    )}
                                    {sessionDatesSorted.map(date => {
                                        const sess = sessions.find(s => s.date === date);
                                        const presentCount = sess.records.filter(r => r.status === 'present').length;
                                        const lateCount = sess.records.filter(r => r.status === 'late').length;
                                        const absentCount = sess.records.filter(r => r.status === 'absent' || r.status === 'absent_excused').length;
                                        return (
                                            <div 
                                                key={date}
                                                className={`w-full flex justify-between items-center p-3 rounded-2xl border transition-colors ${date === selectedSessionDate ? 'bg-emerald-50 border-emerald-200' : 'bg-gray-50 border-transparent'}`}
                                            >
                                                <button 
                                                    onClick={() => { setSelectedSessionDate(date); setShowSessionHistory(false); }}
                                                    className="flex-1 text-right"
                                                >
                                                    <span className="text-xs font-black text-gray-700 block">{formatDisplayDateShort(date)}{date === todayKey ? ' (اليوم)' : ''}</span>
                                                    <span className="text-[10px] font-bold text-gray-400 flex items-center gap-2 mt-0.5 flex-wrap">
                                                        <span className="text-emerald-600">✔ حاضر {presentCount}</span>
                                                        <span className="text-amber-600">🕒 تأخر {lateCount}</span>
                                                        <span className="text-red-500">✖ غائب {absentCount}</span>
                                                    </span>
                                                </button>
                                                <button 
                                                    onClick={() => confirmDeleteDay(date)}
                                                    title="حذف تسجيلات هذا اليوم"
                                                    className="text-gray-300 hover:text-red-500 p-2 transition-colors"
                                                >
                                                    <Icon name="trash-2" size={15} />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-lg border-t border-gray-100 p-2 flex justify-around items-center no-print z-50 rounded-t-[30px] shadow-2xl">
                        <button onClick={() => {setActiveTab('dashboard'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="home" size={20} />
                            <span className="text-[10px] font-black mt-1">الرئيسية</span>
                        </button>
                        <button onClick={() => {setActiveTab('session'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'session' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="edit-3" size={20} />
                            <span className="text-[10px] font-black mt-1">الجلسة</span>
                        </button>
                        <button onClick={() => {setActiveTab('students'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'students' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="users" size={20} />
                            <span className="text-[10px] font-black mt-1">الطلاب</span>
                        </button>
                        <button onClick={() => {setActiveTab('reports'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'reports' || activeTab === 'student_profile' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="bar-chart-3" size={20} />
                            <span className="text-[10px] font-black mt-1">التقارير</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // تسجيل الـ Service Worker: يخزّن الصفحة والمكتبات بعد أول فتح ناجح بالإنترنت،
        // حتى يستمر التطبيق بالعمل لاحقاً بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
