    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        /* ترتيب خطوط احتياطي: إذا تعذّر تحميل Tajawal (لا يوجد إنترنت، كما يحصل داخل تطبيق مُغلّف offline)
           فإن Noto Sans Arabic مثبّت ضمن نظام أندرويد نفسه افتراضياً، فتبقى الواجهة عربية واضحة
           بدل أن ترتد لخط افتراضي عام لا علاقة له بهوية التطبيق */
        body { font-family: 'Tajawal', 'Noto Sans Arabic', 'Noto Kufi Arabic', 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 900; }
        @media print {
            @page { size: A4; margin: 12mm; }
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .max-w-md { max-width: 100% !important; }
            main { padding: 0 !important; margin: 0 !important; }
            .print-area { box-shadow: none !important; border: 1px solid #d1d5db !important; max-width: 186mm !important; margin: 0 auto !important; }
            tr, .stat-box { break-inside: avoid; }
            thead { display: table-header-group; }
        }
        /* الوضع الليلي: للشاشة فقط، ولا يمسّ مسرح التصدير (الصور وPDF تبقى بألوانها الأصلية) ولا الطباعة */
        @media screen {
            html.dark { color-scheme: dark; }
            html.dark body { background-color: #0b1220; color: #e5e7eb; }
            html.dark .bg-white:not(.export-stage *), html.dark .bg-white\/80:not(.export-stage *), html.dark .bg-white\/90:not(.export-stage *), html.dark .bg-white\/95:not(.export-stage *) { background-color: #16213a !important; }
            html.dark .bg-gray-50:not(.export-stage *), html.dark .bg-gray-100:not(.export-stage *), html.dark .bg-gray-50\/50:not(.export-stage *), html.dark .hover\:bg-gray-50:hover, html.dark .hover\:bg-gray-100:hover { background-color: #1f2d49 !important; }
            html.dark .bg-emerald-50:not(.export-stage *), html.dark .bg-emerald-50\/60:not(.export-stage *), html.dark .bg-emerald-100:not(.export-stage *), html.dark .hover\:bg-emerald-100:hover { background-color: rgba(16,185,129,.14) !important; }
            html.dark .bg-teal-50:not(.export-stage *), html.dark .bg-blue-50:not(.export-stage *) { background-color: rgba(59,130,246,.14) !important; }
            html.dark .bg-amber-50:not(.export-stage *), html.dark .bg-yellow-50:not(.export-stage *), html.dark .bg-yellow-100:not(.export-stage *), html.dark .bg-orange-50:not(.export-stage *), html.dark .bg-orange-100:not(.export-stage *) { background-color: rgba(245,158,11,.14) !important; }
            html.dark .bg-red-50:not(.export-stage *), html.dark .bg-red-100:not(.export-stage *) { background-color: rgba(239,68,68,.16) !important; }
            html.dark .text-gray-900:not(.export-stage *), html.dark .text-gray-800:not(.export-stage *), html.dark .text-gray-700:not(.export-stage *), html.dark .text-gray-600:not(.export-stage *) { color: #e5e7eb !important; }
            html.dark .text-gray-500:not(.export-stage *), html.dark .text-gray-400:not(.export-stage *), html.dark .text-gray-300:not(.export-stage *) { color: #94a3b8 !important; }
            html.dark .text-emerald-900:not(.export-stage *), html.dark .text-emerald-800:not(.export-stage *), html.dark .text-emerald-700:not(.export-stage *) { color: #6ee7b7 !important; }
            html.dark .text-red-700:not(.export-stage *), html.dark .text-red-600:not(.export-stage *) { color: #fca5a5 !important; }
            html.dark .text-amber-800:not(.export-stage *), html.dark .text-orange-600:not(.export-stage *), html.dark .text-yellow-700:not(.export-stage *) { color: #fcd34d !important; }
            html.dark .border-gray-50:not(.export-stage *), html.dark .border-gray-100:not(.export-stage *), html.dark .border-gray-200:not(.export-stage *), html.dark .border-emerald-100:not(.export-stage *), html.dark .border-red-100:not(.export-stage *), html.dark .border-amber-200:not(.export-stage *) { border-color: #2b3b5c !important; }
            html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: #2b3b5c !important; }
            html.dark input:not(.export-stage *), html.dark select:not(.export-stage *), html.dark textarea:not(.export-stage *) { color: #f1f5f9; }
            html.dark input::placeholder, html.dark textarea::placeholder { color: #64748b; }
            html.dark .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,.45); }
        }
        html { scroll-behavior: smooth; }
        *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
        button { transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease, opacity .2s; touch-action: manipulation; }
        button:active:not(:disabled) { transform: scale(.97); }
        button:disabled { opacity: .5; }
        input, select, textarea { transition: box-shadow .2s ease, background-color .2s ease; }
        input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,.28); }
        main > div { animation: hlFade .28s ease both; }
        .fixed.inset-0 > .shadow-2xl { animation: hlPop .22s ease both; }
        @keyframes hlFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes hlPop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
        .overflow-y-auto { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
        nav.fixed, .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        /* مسرح التصدير: يُركَّب فقط لحظة إنشاء الصورة/PDF ثم يُزال بالكامل، ولا يُعرض أبداً للمستخدم ولا في الطباعة */
        .export-stage { position: fixed; top: 0; left: -10000px; z-index: -1; pointer-events: none; }
        @media print { .export-stage { display: none !important; } }
    
        /* ===== تحسينات تجربة الاستخدام ===== */
        html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: none; }
        button, nav { -webkit-user-select: none; user-select: none; }
        button { transition: transform .12s ease, background-color .2s ease, opacity .2s ease; }
        button:active:not(:disabled) { transform: scale(.97); }
        :focus-visible { outline: 2px solid #10b981; outline-offset: 2px; }
        input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
        @media screen {
            nav.fixed button { min-height: 54px; min-width: 68px; }
            nav.fixed button span { font-size: 11px !important; }
            .text-\[10px\]:not(.export-stage *), .text-\[10\.5px\]:not(.export-stage *) { font-size: 11px !important; }
        }
        /* إشعارات غير حاجبة */
        #hl-toast-box { position: fixed; left: 0; right: 0; bottom: calc(88px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 9999; pointer-events: none; padding: 0 16px; }
        .hl-toast { max-width: 100%; padding: 11px 18px; border-radius: 16px; color: #fff; font-size: 13px; font-weight: 700; line-height: 1.6; text-align: center; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35); animation: hlToastIn .25s ease both; }
        .hl-toast-ok { background: #064e3b; }
        .hl-toast-bad { background: #b91c1c; }
        .hl-toast-out { opacity: 0; transform: translateY(8px); transition: opacity .3s ease, transform .3s ease; }
        @keyframes hlToastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
        @media print { #hl-toast-box { display: none !important; } }
        /* شاشة التحميل */
        #hl-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(160deg, #10b981 0%, #047857 55%, #064e3b 100%); color: #fff; z-index: 9998; text-align: center; padding: 24px; font-family: 'Tajawal','Noto Sans Arabic',sans-serif; }
        #hl-splash .hl-name { font-size: 34px; font-weight: 900; line-height: 1.2; margin-top: 4px; }
        #hl-splash .hl-sub { font-size: 13px; font-weight: 700; opacity: .85; }
        #hl-splash .hl-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fbbf24; animation: hlSpin .9s linear infinite; margin-top: 18px; }
        #hl-splash #hl-slow { margin-top: 18px; max-width: 300px; font-size: 12.5px; font-weight: 700; line-height: 1.8; }
        #hl-splash #hl-slow[hidden] { display: none; }
        #hl-splash #hl-slow button { margin-top: 10px; background: #fff; color: #047857; border: 0; border-radius: 999px; padding: 9px 22px; font-weight: 900; font-family: inherit; font-size: 13px; }
        @keyframes hlSpin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"><div id="hl-splash" role="status" aria-live="polite"><svg width="96" height="96" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#ffffff" opacity=".14"/><circle cx="60.00" cy="11.00" r="5" fill="#fbbf24" opacity="1"/><circle cx="84.50" cy="17.56" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="102.44" cy="35.50" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="109.00" cy="60.00" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="102.44" cy="84.50" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="84.50" cy="102.44" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="60.00" cy="109.00" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="35.50" cy="102.44" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="17.56" cy="84.50" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="11.00" cy="60.00" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="17.56" cy="35.50" r="3.4" fill="#ffffff" opacity="0.85"/><circle cx="35.50" cy="17.56" r="3.4" fill="#ffffff" opacity="0.85"/><path d="M60 47 C52 40 38 39 27 43 L27 80 C38 76 52 77 60 84 Z" fill="#fff"/><path d="M60 47 C68 40 82 39 93 43 L93 80 C82 76 68 77 60 84 Z" fill="#fff"/><path d="M60 47 L60 84" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/></svg><div class="hl-name">حَلَقَتي</div><div class="hl-sub">إدارة حلقات القرآن الكريم</div><div class="hl-spin" aria-hidden="true"></div><div id="hl-slow" hidden><p>يتأخر التحميل… عند أول تشغيل يلزم اتصال بالإنترنت لتحميل مكونات التطبيق.</p><button onclick="location.reload()">إعادة المحاولة</button></div></div></div>

        <script>setTimeout(function(){var s=document.getElementById('hl-splash'),m=document.getElementById('hl-slow');if(s&&m)m.hidden=false;},9000);</script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.292.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        // إشعار خفيف غير حاجب بدل نافذة alert
        const notify = (msg) => {
            try {
                const bad = /(تعذّر|تعذر|غير كاف|يرجى|لا توجد|لا يوجد|غير صالح|خطأ)/.test(String(msg));
                let box = document.getElementById('hl-toast-box');
                if (!box) {
                    box = document.createElement('div');
                    box.id = 'hl-toast-box';
                    box.setAttribute('role', 'status');
                    box.setAttribute('aria-live', 'polite');
                    document.body.appendChild(box);
                }
                const el = document.createElement('div');
                el.className = 'hl-toast ' + (bad ? 'hl-toast-bad' : 'hl-toast-ok');
                el.textContent = String(msg);
                box.appendChild(el);
                setTimeout(() => { el.classList.add('hl-toast-out'); setTimeout(() => el.remove(), 300); }, bad ? 4200 : 2800);
            } catch (e) { window.alert(msg); }
        };

        const TERMS_VERSION = '5';
        const TERMS_UPDATED = 'أكتوبر 2026';
        const LICENSEE = 'مؤسسة دار الأرقم';
        const OWNER = 'سيف الدين مكية';
        const APP_VERSION = '1.1.0';
        const TERMS_SECTIONS = [
            { h: 'الغرض والإذن', p: 'حلقتي تطبيق مخصَّص لإدارة الحلقات القرآنية ومتابعة الطلاب وإعداد التقارير. وقد اتُّفق مع مؤسسة دار الأرقم على استخدامه في حلقاتها، ويحق لها توزيعه على معلميها وإداريّيها العاملين فيها.' },
            { h: 'حقوق الملكية', p: 'التطبيق واسمه وشعاره وتصميمه وشيفرته من حقوق مطوّره، واستخدامه لا ينقل ملكيته.' },
            { h: 'حدود الاستخدام', p: 'لا يجوز نسخ التطبيق أو بيعه أو رفعه على متجر أو موقع، ولا إتاحته لجهات أخرى إلا بإذن من مطوّره. ولمطوّره الحق في تطويره وإتاحته لجهات أخرى.' },
            { h: 'البيانات والخصوصية', p: 'يعمل التطبيق دون إنترنت، وتُحفظ بيانات الطلاب على جهاز المستخدم ولا يطّلع عليها مطوّر التطبيق، وهي ملك المؤسسة. وتتولى المؤسسة حماية الأجهزة، والحصول على موافقة أولياء الأمور على حفظ بيانات أبنائهم.' },
            { h: 'النسخ الاحتياطي', p: 'البيانات محفوظة على الجهاز نفسه، فقد تضيع عند حذف التطبيق أو مسح بياناته أو تعطّل الجهاز. احفظ نسخة احتياطية بانتظام من الإعدادات.' },
            { h: 'الضمان', p: 'يُقدَّم التطبيق كما هو، ونجتهد في جودته لكن لا نضمن خلوّه من الأخطاء. ودقة التقارير المرسلة لأولياء الأمور مسؤولية المعلم.' },
            { h: 'التحديثات', p: 'قد تُحدَّث هذه الشروط مع تطوير التطبيق، واستمرار الاستخدام يعني الموافقة على المعدَّل منها.' },
        ];
        const TermsParties = () => (
            <div className="rounded-2xl bg-gray-50 border border-gray-100 p-3 space-y-1 text-[12px] font-bold">
                <p className="text-gray-500">الجهة المستخدمة: <span className="text-gray-800">{LICENSEE}</span></p>
                <p className="text-gray-500">مطوّر التطبيق: <span className="text-gray-800">{OWNER}</span></p>
            </div>
        );
        const STORAGE_KEY = 'halaqati_app_data_v2';
        const localDateKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const hashStr = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); };
        const hijriToday = () => { try { return new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } };
        const autoSnapshot = (reason) => { try { const d = localStorage.getItem(STORAGE_KEY); if (d) localStorage.setItem('halaqati_auto_backup', JSON.stringify({ at: Date.now(), reason, data: d })); } catch (e) {} };

        // بطاقة مؤشر (KPI): عنوان واضح + فاصل صغير + قيمة بارزة + وصف مختصر، لكل معلومة مساحتها الخاصة
        const KPI_ACCENTS = {
            emerald: { bar: 'border-emerald-500', chip: 'bg-emerald-50 text-emerald-600', value: 'text-emerald-700' },
            blue:    { bar: 'border-blue-500',    chip: 'bg-blue-50 text-blue-600',       value: 'text-blue-700' },
            amber:   { bar: 'border-amber-500',   chip: 'bg-amber-50 text-amber-600',     value: 'text-amber-600' },
            orange:  { bar: 'border-orange-500',  chip: 'bg-orange-50 text-orange-600',   value: 'text-orange-600' },
            red:     { bar: 'border-red-500',     chip: 'bg-red-50 text-red-600',         value: 'text-red-600' },
        };
        const KpiCard = ({ label, value, hint, icon, accent = 'emerald' }) => {
            const a = KPI_ACCENTS[accent];
            return (
                <div className={`bg-white rounded-3xl card-shadow border-b-4 ${a.bar} p-4 min-w-0 flex flex-col gap-2`}>
                    <div className="flex items-center gap-2 min-w-0">
                        <span className={`shrink-0 w-8 h-8 rounded-xl flex items-center justify-center ${a.chip}`}>
                            <Icon name={icon} size={16} />
                        </span>
                        <p className="text-[12px] font-black text-gray-600 leading-snug">{label}</p>
                    </div>
                    <div className="h-px bg-gray-100"></div>
                    <p className={`text-3xl font-black leading-none ${a.value}`}>{value}</p>
                    {hint && <p className="text-[10.5px] font-bold text-gray-400 leading-snug">{hint}</p>}
                </div>
            );
        };

        // توحيد الحروف العربية المتشابهة لتسهيل البحث بالاسم (أ/إ/آ → ا، ة → ه، ى → ي) وإزالة التشكيل
        const normalizeArabic = (str) => (str || '')
            .toLowerCase()
            .replace(/[\u064B-\u0652\u0640]/g, '')
            .replace(/[أإآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي');

        // ===================== الشعار =====================
        // شعار حَلَقَتي: حلقة من الطلاب (النقاط) حول كتاب مفتوح، النقطة الذهبية العليا ترمز للمعلّم
        const Logo = ({ size = 40, symbolOnly = false, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 120 120" className={className} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شعار حلقتي">
                {!symbolOnly && (
                    <React.Fragment>
                        <defs>
                            <linearGradient id="hlg-grad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stopColor="#10b981" />
                                <stop offset="1" stopColor="#065f46" />
                            </linearGradient>
                        </defs>
                        <rect width="120" height="120" rx="28" fill="url(#hlg-grad)" />
                    </React.Fragment>
                )}
                {Array.from({ length: 12 }, (_, k) => {
                    const a = (k * 30 - 90) * Math.PI / 180;
                    return <circle key={k} cx={60 + 49 * Math.cos(a)} cy={60 + 49 * Math.sin(a)} r={k === 0 ? 5 : 3.4} fill={k === 0 ? '#fbbf24' : '#ffffff'} opacity={k === 0 ? 1 : 0.85} />;
                })}
                <path d="M60 47 C52 40 38 39 27 43 L27 80 C38 76 52 77 60 84 Z" fill="#ffffff" />
                <path d="M60 47 C68 40 82 39 93 43 L93 80 C82 76 68 77 60 84 Z" fill="#ffffff" />
                <g stroke="#047857" strokeWidth="2" strokeLinecap="round" fill="none" opacity="0.4">
                    <path d="M33 52 C40 50 47 51 54 55" /><path d="M33 60 C40 58 47 59 54 63" /><path d="M33 68 C40 66 47 67 54 71" />
                    <path d="M87 52 C80 50 73 51 66 55" /><path d="M87 60 C80 58 73 59 66 63" /><path d="M87 68 C80 66 73 67 66 71" />
                </g>
                <path d="M60 47 L60 84" stroke="#fbbf24" strokeWidth="2.4" strokeLinecap="round" />
            </svg>
        );

        // ===================== محرك التقاط التقارير (صورة / PDF) =====================
        // نرسم التقرير عبر SVG/foreignObject: المتصفح نفسه يرسم النص العربي فتبقى الحروف متصلة وصحيحة،
        // بدل محاكاة الرسم حرفاً حرفاً (كما تفعل html2canvas) والتي تفصل حروف الكلمات العربية.
        let __embeddedFontCss = null;
        let __fontFailAt = 0;
        const fetchWithTimeout = async (url, ms) => {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);
            try { return await fetch(url, { signal: c.signal }); } finally { clearTimeout(t); }
        };
        const bufferToBase64 = (buf) => {
            const bytes = new Uint8Array(buf);
            let s = '';
            for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(s);
        };
        // نضمّن خط Tajawal داخل الصورة (يُجلب مرة واحدة ثم يُحفظ)، وإن تعذّر نكمل بخط النظام العربي
        const getEmbeddedFontCss = async () => {
            if (__embeddedFontCss) return __embeddedFontCss;
            if (Date.now() - __fontFailAt < 60000) return '';
            try {
                const res = await fetchWithTimeout('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap', 7000);
                if (!res.ok) throw new Error('css');
                const css = await res.text();
                const blocks = [...css.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)].filter(m => m[1] === 'arabic' || m[1] === 'latin');
                let out = '';
                for (const m of blocks) {
                    const u = m[2].match(/url\((https:[^)]+)\)/);
                    if (!u) continue;
                    const fr = await fetchWithTimeout(u[1], 9000);
                    if (!fr.ok) continue;
                    out += m[2].replace(u[0], `url(data:font/woff2;base64,${bufferToBase64(await fr.arrayBuffer())})`) + '\n';
                }
                if (!out) throw new Error('nofonts');
                __embeddedFontCss = out;
                return out;
            } catch (e) {
                __fontFailAt = Date.now();
                return '';
            }
        };

        // أنماط الصفحة (Tailwind المحلي + أنماط التطبيق) لتُحقن داخل الصورة
        const collectPageCss = () => {
            let css = '';
            for (const sheet of Array.from(document.styleSheets)) {
                let rules;
                try { rules = sheet.cssRules; } catch (e) { continue; }
                if (!rules) continue;
                for (const r of Array.from(rules)) { if (r.type === 3) continue; css += r.cssText + '\n'; }
            }
            return css.replace(/\]\]>/g, '');
        };

        const captureNodeToCanvas = async (node, scale = 2) => {
            if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
            const rect = node.getBoundingClientRect();
            const w = Math.ceil(rect.width), h = Math.ceil(rect.height);
            if (!w || !h) throw new Error('empty-node');
            scale = Math.max(1, Math.min(scale, 14000 / h, 14000 / w));
            const fontCss = await getEmbeddedFontCss();
            const xhtml = new XMLSerializer().serializeToString(node);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}"><style><![CDATA[${collectPageCss()}\n${fontCss}]]></style><foreignObject x="0" y="0" width="${w}" height="${h}">${xhtml}</foreignObject></svg>`;
            // نستخدم data URL (وليس blob URL) لأن المتصفح يعتبر الـ canvas "ملوّثاً" ولا يسمح بتصديره عند استخدام blob مع foreignObject
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            try {
                const img = new Image();
                img.src = url;
                await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('svg-load')); });
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(w * scale);
                canvas.height = Math.round(h * scale);
                const ctx = canvas.getContext('2d');
                const draw = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                draw();
                // الرسم الثاني يضمن ظهور الخط المضمّن بعد فك ترميزه
                if (fontCss) { await new Promise(r => setTimeout(r, 200)); draw(); }
                return canvas;
            } finally {
                // لا شيء لتحريره: data URL
            }
        };

        // نتحقق ما إذا كانت الصورة الملتقطة فارغة فعلياً (كل البكسلات تقريباً بيضاء)
        const isCanvasBlank = (canvas) => {
            try {
                const tw = 60, th = 60;
                const tmp = document.createElement('canvas');
                tmp.width = tw; tmp.height = th;
                const tctx = tmp.getContext('2d');
                tctx.drawImage(canvas, 0, 0, tw, th);
                const data = tctx.getImageData(0, 0, tw, th).data;
                let nonWhite = 0;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) nonWhite++;
                }
                return nonWhite < 3;
            } catch (e) {
                return false;
            }
        };

        // حدود العناصر التي لا يجوز تقطيعها بين صفحتين (صفوف الجداول + كل عنصر يحمل avoid-break)، نسبة لأعلى التقرير
        const getSafeBreakPoints = (containerEl) => {
            if (!containerEl) return [];
            const top0 = containerEl.getBoundingClientRect().top;
            const pts = [];
            containerEl.querySelectorAll('tr, .avoid-break').forEach(el => {
                const r = el.getBoundingClientRect();
                pts.push({ top: r.top - top0, bottom: r.bottom - top0 });
            });
            return pts;
        };

        // بناء ملف PDF حقيقي (صفحات A4) من صورة التقرير دون أي مكتبة خارجية
        const buildPdfFromCanvas = async (canvas, breakPoints, header) => {
            const PW = 595.28, PH = 841.89;
            const pageW = canvas.width;
            const pageH = Math.round(pageW * PH / PW);
            const marginTop = Math.round(pageW * 0.022);
            const marginBottom = Math.round(pageW * 0.05);
            const usable = pageH - marginTop - marginBottom;

            const slices = [];
            const hdrH = header ? Math.round(header.bottom - header.top) : 0; // ارتفاع رأس الجدول المكرَّر في الصفحات التالية
            let cursor = 0;
            let fit = 1; // إذا كان التقرير أطول من الصفحة بقدر بسيط (حتى 8%) نصغّره قليلاً ليبقى في صفحة واحدة
            if (canvas.height > usable && canvas.height <= usable * 1.08) {
                fit = usable / canvas.height;
                slices.push([0, canvas.height]);
                cursor = canvas.height;
            }
            while (cursor < canvas.height - 1) {
                const avail = (slices.length > 0 && hdrH && cursor > header.bottom) ? usable - hdrH : usable;
                let cut = Math.min(cursor + avail, canvas.height);
                if (cut < canvas.height) {
                    let moved = true, guard = 0;
                    while (moved && guard++ < 50) {
                        moved = false;
                        for (const bp of breakPoints) {
                            if (bp.top < cut && bp.bottom > cut && bp.top > cursor) { cut = bp.top; moved = true; }
                        }
                    }
                    if (cut - cursor < avail * 0.2) cut = Math.min(cursor + avail, canvas.height);
                }
                slices.push([cursor, cut]);
                cursor = cut;
            }
            // لا نترك صفحة أخيرة شبه فارغة: نضمّ الشريحة الأخيرة الصغيرة جداً إلى ما قبلها
            if (slices.length > 1 && slices[slices.length - 1][1] - slices[slices.length - 1][0] < 70) {
                const last = slices.pop();
                slices[slices.length - 1][1] = last[1];
            }

            const jpegs = [];
            for (let i = 0; i < slices.length; i++) {
                const [a, b] = slices[i];
                const pc = document.createElement('canvas');
                pc.width = pageW; pc.height = pageH;
                const ctx = pc.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, pageW, pageH);
                const dw = pageW * fit, dh = (b - a) * fit;
                let y0 = marginTop;
                if (i > 0 && hdrH && a > header.bottom) {
                    // نكرّر رأس الجدول أعلى كل صفحة تالية ليبقى معنى الأعمدة واضحاً
                    ctx.drawImage(canvas, 0, header.top, pageW, hdrH, 0, y0, pageW, hdrH);
                    y0 += hdrH;
                }
                ctx.drawImage(canvas, 0, a, pageW, b - a, (pageW - dw) / 2, y0, dw, dh);
                ctx.fillStyle = '#9ca3af';
                ctx.font = `${Math.round(pageW * 0.0125)}px Tajawal, "Noto Sans Arabic", sans-serif`;
                ctx.textAlign = 'center';
                ctx.direction = 'rtl';
                ctx.fillText(`حَلَقَتي  •  صفحة ${i + 1} من ${slices.length}`, pageW / 2, pageH - Math.round(pageW * 0.022));
                const jb = await new Promise(r => pc.toBlob(r, 'image/jpeg', 0.92));
                jpegs.push(new Uint8Array(await jb.arrayBuffer()));
            }

            const enc = new TextEncoder();
            const chunks = []; let offset = 0; const offs = [];
            const push = (d) => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); offset += b.length; };
            const n = jpegs.length;
            const objCount = 2 + n * 3;
            push('%PDF-1.4\n');
            offs[1] = offset; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
            const kids = Array.from({ length: n }, (_, i) => `${5 + 3 * i} 0 R`).join(' ');
            offs[2] = offset; push(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
            for (let i = 0; i < n; i++) {
                const imgId = 3 + 3 * i, cId = 4 + 3 * i, pId = 5 + 3 * i;
                offs[imgId] = offset;
                push(`${imgId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegs[i].length} >>\nstream\n`);
                push(jpegs[i]); push('\nendstream\nendobj\n');
                const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
                offs[cId] = offset; push(`${cId} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
                offs[pId] = offset; push(`${pId} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${cId} 0 R >>\nendobj\n`);
            }
            const xrefPos = offset;
            let xref = `xref\n0 ${objCount + 1}\n0000000000 65535 f \n`;
            for (let i = 1; i <= objCount; i++) xref += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
            push(xref + `trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
            return new Blob(chunks, { type: 'application/pdf' });
        };

        const blobToBase64 = (blob) => new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result).split(',')[1]);
            r.onerror = () => rej(r.error);
            r.readAsDataURL(blob);
        });

        // مشاركة/حفظ ملف: داخل تطبيق أندرويد عبر نافذة المشاركة الأصلية، وفي المتصفح عبر المشاركة أو التنزيل
        const shareFile = async (blob, filename, mime, title) => {
            const cap = window.Capacitor;
            const native = cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform();
            if (native && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share) {
                const ext = (filename.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '');
                const tmpName = `halaqati-${Date.now()}.${ext}`;
                const written = await cap.Plugins.Filesystem.writeFile({ path: tmpName, data: await blobToBase64(blob), directory: 'CACHE' });
                await cap.Plugins.Share.share({ title, text: title, url: written.uri, dialogTitle: title });
                return 'native';
            }
            const file = new File([blob], filename, { type: mime });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title, text: title });
                return 'share';
            }
            // عند التنزيل المباشر نستخدم اسم ملف بحروف لاتينية مضمونة الامتداد (بعض المتصفحات تُسقط الأسماء العربية فيضيع .png/.pdf)
            let dlName = filename;
            if (!/^[\x20-\x7E]+$/.test(filename)) {
                const ext = (filename.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '');
                const d = new Date();
                const p2 = (n) => String(n).padStart(2, '0');
                dlName = `halaqati-report-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.${ext}`;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = dlName;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 15000);
            return 'download';
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedStudentId, setSelectedStudentId] = useState(null);
            const [students, setStudents] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [settings, setSettings] = useState({
                halakaName: 'حلقة الإيمان',
                teacherName: 'الشيخ محمد',
                reportFormat: 'detailed'
            });
            const [reportMode, setReportMode] = useState('monthly'); // monthly | custom
            const currentMonthStr = localDateKey().slice(0, 7);
            const [reportMonth, setReportMonth] = useState(currentMonthStr);
            const [reportFrom, setReportFrom] = useState(localDateKey());
            const [reportTo, setReportTo] = useState(localDateKey());
            const [exporting, setExporting] = useState(false);
            const reportRef = useRef(null);
            const studentReportRef = useRef(null);
            // قوالب مخصصة فقط لتصدير الصورة/PDF: عريضة ومؤطّرة بهوية التطبيق، منفصلة تماماً عن بطاقة الجوال الضيقة المعروضة على الشاشة
            const halakaExportRef = useRef(null);
            const studentExportRef = useRef(null);
            const pointsExportRef = useRef(null);
            const [reportSection, setReportSection] = useState(null); // null | 'halaqa' | 'student'
            const [selectedReportStudentId, setSelectedReportStudentId] = useState(null);
            const [studentSearchQuery, setStudentSearchQuery] = useState('');
            const [studentKashfType, setStudentKashfType] = useState('summary'); // summary | detailed
            const [halakaReportType, setHalakaReportType] = useState('detailed'); // summary | detailed
            const [selectedSessionDate, setSelectedSessionDate] = useState(localDateKey());
            const [showSessionHistory, setShowSessionHistory] = useState(false);
            const [showResetModal, setShowResetModal] = useState(false);
            const [resetConfirmText, setResetConfirmText] = useState('');
            const [showDrawer, setShowDrawer] = useState(false);
            const [exportJob, setExportJob] = useState(null); // null | { kind: 'halaka'|'student'|'points', format: 'image'|'pdf', fileTitle, shareTitle }
            const [sessionSearchQuery, setSessionSearchQuery] = useState('');
            const [guideSeen, setGuideSeen] = useState(() => { try { return localStorage.getItem('halaqati_guide_seen') === '1'; } catch (e) { return false; } });
            const [theme, setTheme] = useState(() => { try { return localStorage.getItem('halaqati_theme') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } });
            useEffect(() => {
                const isDark = theme === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
                const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', isDark ? '#0b1220' : '#047857');
                try { localStorage.setItem('halaqati_theme', theme); } catch (e) {}
            }, [theme]);
            const [termsOk, setTermsOk] = useState(() => { try { return localStorage.getItem('halaqati_terms_v' + TERMS_VERSION) === '1'; } catch (e) { return false; } });
            const acceptTerms = () => { try { localStorage.setItem('halaqati_terms_v' + TERMS_VERSION, '1'); } catch (e) {} setTermsOk(true); };
            const markGuideSeen = () => { try { localStorage.setItem('halaqati_guide_seen', '1'); } catch (e) {} setGuideSeen(true); };

            const [loaded, setLoaded] = useState(false);
            const [openCards, setOpenCards] = useState({});
            // Load Data
            useEffect(() => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        setStudents(parsed.students || []);
                        setSessions(parsed.sessions || []);
                        setTransactions(parsed.transactions || []);
                        setSettings({ ...settings, ...(parsed.settings || {}) });
                    } catch(e) {
                        console.error("Error parsing local storage", e);
                        try { localStorage.setItem(STORAGE_KEY + '_corrupt', savedData); } catch (e2) {}
                        return; // لا نكتب فوق البيانات الأصلية إذا تعذّرت قراءتها
                    }
                }
                setLoaded(true);
            }, []);

            // Save Data & Render Icons
            useEffect(() => {
                const data = { students, sessions, settings, transactions };
                if (loaded) localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (window.lucide) window.lucide.createIcons();
            }, [loaded, students, sessions, settings, transactions, activeTab]);

            // أيقونات التقرير المفتوح: تُحوَّل إلى SVG عند فتح التقرير أو تبديل نوعه/فترته أو انتهاء التصدير
            // (كانت تبقى فارغة لأن التأثير أعلاه لا يراقب هذه الحالات)
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [reportSection, selectedReportStudentId, halakaReportType, studentKashfType, reportMode, reportMonth, reportFrom, reportTo, exporting, exportJob]);

            // Date Formatting
            const getTodayDate = () => {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return new Date().toLocaleDateString('ar-EG-u-nu-latn', options);
            };

            const formatDate = (isoString) => {
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                return new Date(isoString).toLocaleDateString('ar-EG-u-nu-latn', options);
            };

            const todayKey = localDateKey();

            // Dashboard Stats
            const stats = useMemo(() => {
                const todaySession = sessions.find(s => s.date === todayKey);
                return {
                    totalStudents: students.filter(s => s.active).length,
                    presentToday: todaySession ? todaySession.records.filter(r => r.status === 'present').length : 0,
                    lateToday: todaySession ? todaySession.records.filter(r => r.status === 'late').length : 0,
                    absentToday: todaySession ? todaySession.records.filter(r => r.status === 'absent' || r.status === 'absent_excused').length : 0,
                    excusedToday: todaySession ? todaySession.records.filter(r => r.status === 'absent_excused').length : 0,
                    unexcusedToday: todaySession ? todaySession.records.filter(r => r.status === 'absent').length : 0,
                };
            }, [students, sessions, todayKey]);

            // Points Logic
            const getStudentPoints = (studentId) => {
                return transactions
                    .filter(t => t.studentId === studentId)
                    .reduce((sum, t) => sum + t.pointsChange, 0);
            };

            const getStudentPointsForDate = (studentId, dateStr) => {
                return transactions
                    .filter(t => t.studentId === studentId && localDateKey(new Date(t.date)) === dateStr)
                    .reduce((sum, t) => sum + t.pointsChange, 0);
            };

            const getStudentTodayPoints = (studentId) => getStudentPointsForDate(studentId, todayKey);

            const addPointsTransaction = (studentId, pointsChange, type, note = '') => {
                const newTransaction = {
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    studentId,
                    pointsChange,
                    type,
                    note,
                    date: new Date().toISOString()
                };
                setTransactions(prev => [newTransaction, ...prev]);
            };

            // Handlers
            const addStudent = (e) => {
                e.preventDefault();
                const name = e.target.studentName.value;
                if (!name) return;
                const newStudent = {
                    id: Date.now().toString(),
                    name,
                    phone: e.target.parentPhone.value,
                    active: true,
                    joinDate: new Date().toISOString()
                };
                setStudents([...students, newStudent]);
                e.target.reset();
            };

            const toggleStudentStatus = (id) => {
                setStudents(students.map(s => s.id === id ? {...s, active: !s.active} : s));
            };

            const deleteStudent = (id) => {
                if(confirm("حذف الطالب نهائياً سيمسح نقاطه أيضاً. إن أردت إخفاءه فقط فاستخدم زر الإيقاف المؤقت. هل تريد الحذف؟")) {
                    autoSnapshot('delete-student');
                    setStudents(students.filter(s => s.id !== id));
                    setTransactions(transactions.filter(t => t.studentId !== id));
                }
            };

            const saveSessionRecord = (studentId, field, value, dateStr = selectedSessionDate) => {
                setSessions(prev => {
                    const sessionIndex = prev.findIndex(s => s.date === dateStr);
                    let newSessions = [...prev];
                    
                    if (sessionIndex === -1) {
                        newSessions.push({
                            date: dateStr,
                            records: [{ studentId, [field]: value }]
                        });
                    } else {
                        const recordIndex = newSessions[sessionIndex].records.findIndex(r => r.studentId === studentId);
                        if (recordIndex === -1) {
                            newSessions[sessionIndex] = { ...newSessions[sessionIndex], records: [...newSessions[sessionIndex].records, { studentId, [field]: value }] };
                        } else {
                            newSessions[sessionIndex] = { ...newSessions[sessionIndex], records: newSessions[sessionIndex].records.map((r, i) => i === recordIndex ? { ...r, [field]: value } : r) };
                        }
                    }
                    return newSessions;
                });
            };

            const getRecord = (studentId, dateStr = selectedSessionDate) => {
                const session = sessions.find(s => s.date === dateStr);
                return session?.records.find(r => r.studentId === studentId) || {
                    status: 'none',
                    hifzPages: '', hifzNote: '', hifzPassed: '',
                    reviewPages: '', reviewNote: '', reviewPassed: '',
                    rating: 'جيد'
                };
            };

            // حذف تسجيل يوم كامل نهائياً (يستخدم من صفحة السجل أو من داخل شاشة الجلسة)
            const deleteSessionDay = (dateStr) => {
                setSessions(prev => prev.filter(s => s.date !== dateStr));
            };

            const confirmDeleteDay = (dateStr) => {
                if (confirm(`سيتم حذف كل تسجيلات يوم ${formatDisplayDateShort(dateStr)} نهائياً (الحضور، الحفظ، المراجعة) ولا يمكن التراجع. هل أنت متأكد؟`)) {
                    deleteSessionDay(dateStr);
                    if (selectedSessionDate === dateStr) setSelectedSessionDate(todayKey);
                }
            };

            // مسح تسجيل طالب واحد ضمن يوم معيّن (بدون التأثير على بقية الطلاب أو الأيام الأخرى)
            const clearStudentRecordForDate = (studentId, dateStr) => {
                setSessions(prev => prev.map(s => {
                    if (s.date !== dateStr) return s;
                    return { ...s, records: s.records.filter(r => r.studentId !== studentId) };
                }));
            };

            // كل الأيام القابلة للتصفح: كل يوم فيه تسجيلات + اليوم الحالي دائماً
            const browsableDates = useMemo(() => {
                const set = new Set(sessions.map(s => s.date));
                set.add(todayKey);
                return Array.from(set).sort((a, b) => a.localeCompare(b));
            }, [sessions, todayKey]);

            const sessionDatesSorted = useMemo(() => {
                return [...sessions].map(s => s.date).sort((a, b) => b.localeCompare(a));
            }, [sessions]);

            const currentDateIndex = browsableDates.indexOf(selectedSessionDate);
            const canGoPrevDate = currentDateIndex > 0;
            const canGoNextDate = currentDateIndex !== -1 && currentDateIndex < browsableDates.length - 1;
            const goPrevDate = () => { if (canGoPrevDate) setSelectedSessionDate(browsableDates[currentDateIndex - 1]); };
            const goNextDate = () => { if (canGoNextDate) setSelectedSessionDate(browsableDates[currentDateIndex + 1]); };

            // نتيجة بحث الجلسات: نص البحث بعد إزالة المسافات الزائدة وتوحيد الحروف، ويعمل مع أي جزء من الاسم
            const sessionQueryNorm = normalizeArabic(sessionSearchQuery.trim());
            const sessionStudents = students.filter(s => s.active && (!sessionQueryNorm || normalizeArabic(s.name).includes(sessionQueryNorm)));

            const formatDisplayDateShort = (dateStr) => {
                const d = new Date(dateStr + 'T00:00:00');
                return d.toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'short', day: 'numeric', month: 'short' });
            };

            // تحويل بيانات الحفظ/المراجعة إلى نص جاهز للنسخ بصيغة: عدد الصفحات، الملاحظة، ✓/✗
            const formatFieldLine = (pages, note, passed) => {
                const parts = [];
                if (pages !== '' && pages !== undefined && pages !== null) parts.push(`${pages}صفحة`);
                if (note) parts.push(note);
                if (passed === 'yes') parts.push('✓');
                else if (passed === 'no') parts.push('إعادة ✗');
                return parts.join('، ');
            };

            const quickPages = (studentId, field, current) => (
                <div className="flex gap-1 mt-1.5">
                    {[['0.25', '¼'], ['0.5', '½'], ['1', '1'], ['2', '2'], ['3', '3']].map(([v, l]) => (
                        <button key={v} type="button" onClick={() => saveSessionRecord(studentId, field, String(current) === v ? '' : v)} className={`flex-1 py-1 rounded-lg text-[11px] font-black ${String(current) === v ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700'}`}>{l}</button>
                    ))}
                </div>
            );

            const copySessionReport = (dateStr) => {
                const session = sessions.find(s => s.date === dateStr);
                if (!session) return notify("لا توجد بيانات مسجلة لهذا اليوم");

                const isToday = dateStr === todayKey;
                let presentCount = 0, lateCount = 0, absentCount = 0;

                let report = `━━━━━━━━━━━━━━\n`;
                report += `📖 تقرير حلقة (${settings.halakaName})\n`;
                report += `👤 بإشراف: ${settings.teacherName}\n`;
                report += `📅 ${isToday ? getTodayDate() : formatDisplayDateShort(dateStr)}\n`;
                report += `━━━━━━━━━━━━━━\n`;

                students.filter(s => s.active).forEach((s, index) => {
                    const r = session.records.find(rec => rec.studentId === s.id) || { status: 'none' };
                    const dayPoints = getStudentPointsForDate(s.id, dateStr);
                    if (r.status === 'present') presentCount++;
                    else if (r.status === 'late') lateCount++;
                    else if (r.status === 'absent' || r.status === 'absent_excused') absentCount++;

                    report += `${index + 1}️⃣ ${s.name}\n`;
                    if (r.status === 'present' || r.status === 'late') {
                        report += r.status === 'late' ? `🕒 متأخر\n` : `✔ حاضر\n`;
                        const hifzLine = formatFieldLine(r.hifzPages, r.hifzNote, r.hifzPassed);
                        const reviewLine = formatFieldLine(r.reviewPages, r.reviewNote, r.reviewPassed);
                        if (hifzLine) report += `📌 حفظ: ${hifzLine}\n`;
                        if (reviewLine) report += `📌 مراجعة: ${reviewLine}\n`;
                        report += `⭐ تقييم: ${r.rating || 'جيد'}\n`;
                    } else if (r.status === 'absent_excused') {
                        report += `✖ غائب (بعذر)\n`;
                    } else if (!r.status || r.status === 'none') {
                        report += `➖ لم يُسجَّل\n`;
                    } else {
                        report += `✖ غائب (غير مبرر)\n`;
                    }
                    
                    if (dayPoints > 0) {
                        report += `🎯 نقاط اليوم: +${dayPoints} نقطة\n`;
                    } else if (dayPoints < 0) {
                        report += `🔻 نقاط اليوم: ${dayPoints} نقطة\n`;
                    }

                    report += `──────────────\n`;
                });

                report += `الحضور: ${presentCount}\n`;
                report += `التأخر: ${lateCount}\n`;
                report += `الغياب: ${absentCount}\n`;
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                notify("تم نسخ تقرير الجلسة بنجاح!");
            };

            const copyTodayReport = () => copySessionReport(todayKey);

            const copyPointsReport = () => {
                const activeStudents = students.filter(s => s.active);
                if (activeStudents.length === 0) return notify("لا يوجد طلاب لنسخ تقريرهم");

                let report = `━━━━━━━━━━━━━━\n`;
                report += `🏅 تقرير النقاط (${settings.halakaName})\n`;
                report += `👤 بإشراف: ${settings.teacherName}\n`;
                report += `📅 ${getTodayDate()}\n`;
                report += `━━━━━━━━━━━━━━\n`;

                let total = 0;
                activeStudents.forEach((s, index) => {
                    const pts = getStudentPoints(s.id);
                    total += pts;
                    report += `${index + 1}️⃣ ${s.name}\n`;
                    report += `الرصيد: ${pts} نقطة\n`;
                    report += `──────────────\n`;
                });
                report += `إجمالي نقاط الحلقة: ${total} نقطة\n`;
                
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                notify("تم نسخ تقرير الأرصدة بنجاح!");
            };

            // تحديد نطاق التاريخ (من - إلى) بناءً على الوضع المختار: شهري أو فترة مخصصة
            const getReportRange = () => {
                if (reportMode === 'monthly') {
                    const [y, m] = reportMonth.split('-').map(Number);
                    const from = `${reportMonth}-01`;
                    const lastDay = new Date(y, m, 0).getDate();
                    const to = `${reportMonth}-${String(lastDay).padStart(2, '0')}`;
                    return { from, to };
                }
                return { from: reportFrom, to: reportTo };
            };

            // حساب بيانات التقرير الدوري لكل طالب: مجموع صفحات الحفظ/المراجعة (فقط ما تم تسجيله ✓) وأيام الحضور/الغياب
            const periodReportData = useMemo(() => {
                const { from, to } = getReportRange();
                const rangeSessions = sessions.filter(s => s.date >= from && s.date <= to);
                return students.filter(s => s.active).map(student => {
                    let hifzTotal = 0, reviewTotal = 0, presentCount = 0, lateCount = 0, absentCount = 0, excusedCount = 0;
                    rangeSessions.forEach(sess => {
                        const r = sess.records.find(rec => rec.studentId === student.id);
                        if (!r || !r.status || r.status === 'none') return;
                        if (r.status === 'present' || r.status === 'late') {
                            if (r.status === 'late') lateCount++; else presentCount++;
                            if (r.hifzPassed === 'yes') hifzTotal += parseFloat(r.hifzPages) || 0;
                            if (r.reviewPassed === 'yes') reviewTotal += parseFloat(r.reviewPages) || 0;
                        } else if (r.status === 'absent_excused') {
                            excusedCount++;
                        } else if (r.status === 'absent') {
                            absentCount++;
                        }
                    });
                    return { student, hifzTotal, reviewTotal, presentCount, lateCount, absentCount, excusedCount, totalDays: presentCount + lateCount + absentCount + excusedCount };
                });
            }, [students, sessions, reportMode, reportMonth, reportFrom, reportTo]);

            // إجمالي الحلقة كاملة: مجموع صفحات الحفظ والمراجعة لكل الطلاب مجتمعين خلال نفس الفترة
            const overallTotals = useMemo(() => {
                return periodReportData.reduce((acc, row) => {
                    acc.hifzTotal += row.hifzTotal;
                    acc.reviewTotal += row.reviewTotal;
                    acc.presentTotal += row.presentCount;
                    acc.lateTotal += row.lateCount;
                    acc.absentTotal += row.absentCount;
                    acc.excusedTotal += row.excusedCount;
                    return acc;
                }, { hifzTotal: 0, reviewTotal: 0, presentTotal: 0, lateTotal: 0, absentTotal: 0, excusedTotal: 0 });
            }, [periodReportData]);

            const copyPeriodReport = () => {
                const { from, to } = getReportRange();
                if (periodReportData.length === 0) return notify("لا يوجد طلاب لعرض تقريرهم");

                let report = `━━━━━━━━━━━━━━\n`;
                report += `📊 تقرير الحضور والحفظ (${settings.halakaName})\n`;
                report += `👤 بإشراف: ${settings.teacherName}\n`;
                report += `📅 من ${from} إلى ${to}\n`;
                report += `━━━━━━━━━━━━━━\n`;
                report += `🕌 إجمالي الحلقة:\n`;
                report += `عدد الطلاب: ${periodReportData.length} | حضور: ${overallTotals.presentTotal} | تأخر: ${overallTotals.lateTotal}\n`;
                report += `غياب بعذر: ${overallTotals.excusedTotal} | غياب بدون عذر: ${overallTotals.absentTotal}\n`;
                report += `📌 إجمالي صفحات الحفظ: ${overallTotals.hifzTotal}\n`;
                report += `📌 إجمالي صفحات المراجعة: ${overallTotals.reviewTotal}\n`;
                report += `━━━━━━━━━━━━━━\n`;

                if (halakaReportType === 'detailed') {
                    periodReportData.forEach((row, index) => {
                        report += `${index + 1}️⃣ ${row.student.name}\n`;
                        report += `إجمالي الأيام: ${row.totalDays} | حضور: ${row.presentCount} | تأخر: ${row.lateCount}\n`;
                        report += `غياب بعذر: ${row.excusedCount} | غياب بدون عذر: ${row.absentCount}\n`;
                        report += `📌 مجموع الحفظ: ${row.hifzTotal} صفحة\n`;
                        report += `📌 مجموع المراجعة: ${row.reviewTotal} صفحة\n`;
                        report += `──────────────\n`;
                    });
                }
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                notify("تم نسخ التقرير بنجاح!");
            };

            

            // رسم التقرير المؤقت إلى صورة: المحرك الجديد أولاً، وإن فشل نجرّب html2canvas (إن كانت محمّلة)
            const renderExportCanvas = async (ref) => {
                const node = ref.current;
                if (!node) throw new Error('no-node');
                try {
                    const c = await captureNodeToCanvas(node, 2);
                    if (!isCanvasBlank(c)) return c;
                } catch (e) { console.warn('capture engine failed', e); }
                if (window.html2canvas) {
                    const c2 = await window.html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
                    if (c2 && !isCanvasBlank(c2)) return c2;
                }
                throw new Error('capture-failed');
            };

            const shareElementAsImage = async (ref, fileTitle, shareTitle) => {
                try {
                    setExporting(true);
                    const canvas = await renderExportCanvas(ref);
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    if (!blob) throw new Error('blob');
                    await shareFile(blob, `${fileTitle}.png`, 'image/png', shareTitle);
                } catch (err) {
                    if (!(err && err.name === 'AbortError')) { console.error(err); notify("تعذّر تجهيز الصورة، الرجاء المحاولة مرة أخرى."); }
                } finally {
                    setExporting(false);
                }
            };

            const shareElementAsPDF = async (ref, fileTitle, shareTitle) => {
                try {
                    setExporting(true);
                    const node = ref.current;
                    const breakPoints = getSafeBreakPoints(node);
                    const widthPx = node ? node.getBoundingClientRect().width : 1;
                    const canvas = await renderExportCanvas(ref);
                    const k = canvas.width / widthPx;
                    const th = node ? node.querySelector('thead') : null;
                    const nodeTop = node ? node.getBoundingClientRect().top : 0;
                    const header = th ? { top: (th.getBoundingClientRect().top - nodeTop) * k, bottom: (th.getBoundingClientRect().bottom - nodeTop) * k } : null;
                    const blob = await buildPdfFromCanvas(canvas, breakPoints.map(b => ({ top: b.top * k, bottom: b.bottom * k })), header);
                    await shareFile(blob, `${fileTitle}.pdf`, 'application/pdf', shareTitle);
                } catch (err) {
                    if (!(err && err.name === 'AbortError')) { console.error(err); notify("تعذّر تجهيز ملف PDF، الرجاء المحاولة مرة أخرى."); }
                } finally {
                    setExporting(false);
                }
            };

            // ===== تصدير التقارير (صورة/PDF) =====
            // قالب التصدير العريض لا يوجد في الصفحة إلا خلال عملية التصدير نفسها: نركّبه، نلتقطه، ثم نزيله.
            // بهذا لا يتجاور مع التقرير المعروض للمستخدم ولا يظهر في الطباعة.
            const startExport = (kind, format, fileTitle, shareTitle) => {
                if (exporting || exportJob) return;
                setExporting(true);
                setExportJob({ kind, format, fileTitle, shareTitle });
            };

            const exportRow = exportJob && exportJob.kind === 'student'
                ? periodReportData.find(r => r.student.id === selectedReportStudentId)
                : null;
            const exportRange = getReportRange();

            // بيانات تقرير النقاط (تُستخدم في العرض وفي قالب التصدير)
            const pointsRows = students.filter(s => s.active).map(st => ({ student: st, points: getStudentPoints(st.id) }));
            const pointsTotal = pointsRows.reduce((sum, r) => sum + r.points, 0);
            const pointsMax = pointsRows.reduce((m, r) => Math.max(m, r.points), 0);
            const pointsTop = pointsRows.length ? pointsRows.reduce((best, r) => (r.points > best.points ? r : best), pointsRows[0]) : null;

            useEffect(() => {
                if (!exportJob) return;
                let cancelled = false;
                (async () => {
                    // ننتظر رسم القالب المؤقت في الصفحة، ثم نحوّل أيقوناته إلى SVG قبل الالتقاط
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    await new Promise(r => setTimeout(r, 150)); // مهلة قصيرة ليُنهي Tailwind توليد أنماط القالب المؤقت
                    if (cancelled) return;
                    if (window.lucide) window.lucide.createIcons();
                    const ref = exportJob.kind === 'halaka' ? halakaExportRef : (exportJob.kind === 'points' ? pointsExportRef : studentExportRef);
                    try {
                        if (!ref.current) {
                            notify("تعذّر تجهيز التقرير للتصدير، الرجاء المحاولة مرة أخرى.");
                        } else if (exportJob.format === 'pdf') {
                            await shareElementAsPDF(ref, exportJob.fileTitle, exportJob.shareTitle);
                        } else {
                            await shareElementAsImage(ref, exportJob.fileTitle, exportJob.shareTitle);
                        }
                    } finally {
                        setExporting(false);
                        setExportJob(null);
                    }
                })();
                return () => { cancelled = true; };
            }, [exportJob]);

            const statusLabel = (status) => status === 'present' ? 'حاضر' : (status === 'late' ? 'متأخر' : (status === 'absent_excused' ? 'غائب بعذر' : 'غائب'));

            // سجل الأيام التفصيلي لطالب واحد ضمن الفترة المختارة، لبناء الكشف الرسمي
            const studentDayLog = useMemo(() => {
                if (!selectedReportStudentId) return [];
                const { from, to } = getReportRange();
                return sessions
                    .filter(s => s.date >= from && s.date <= to)
                    .map(sess => {
                        const r = sess.records.find(rec => rec.studentId === selectedReportStudentId);
                        if (!r || !r.status || r.status === 'none') return null;
                        const attended = r.status === 'present' || r.status === 'late';
                        return {
                            date: sess.date,
                            status: r.status,
                            hifzLine: attended ? (formatFieldLine(r.hifzPages, r.hifzNote, r.hifzPassed) || '—') : '—',
                            reviewLine: attended ? (formatFieldLine(r.reviewPages, r.reviewNote, r.reviewPassed) || '—') : '—',
                            rating: attended ? (r.rating || '—') : '—'
                        };
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.date.localeCompare(b.date));
            }, [selectedReportStudentId, sessions, reportMode, reportMonth, reportFrom, reportTo]);

            const copyStudentReport = (row) => {
                const { from, to } = getReportRange();
                let report = `━━━━━━━━━━━━━━\n`;
                report += `📋 تقرير أداء الطالب\n`;
                report += `👤 ${row.student.name}\n`;
                report += `🕌 ${settings.halakaName}\n`;
                report += `👤 بإشراف: ${settings.teacherName}\n`;
                report += `📅 من ${from} إلى ${to}\n`;
                report += `━━━━━━━━━━━━━━\n`;
                report += `إجمالي الأيام: ${row.totalDays} | حضور: ${row.presentCount} | تأخر: ${row.lateCount}\n`;
                report += `غياب بعذر: ${row.excusedCount} | غياب بدون عذر: ${row.absentCount}\n`;
                report += `📌 مجموع الحفظ: ${row.hifzTotal} صفحة\n`;
                report += `📌 مجموع المراجعة: ${row.reviewTotal} صفحة\n`;
                report += `━━━━━━━━━━━━━━\n`;
                studentDayLog.forEach(entry => {
                    report += `${entry.date} — ${statusLabel(entry.status)}\n`;
                    if (entry.status === 'present' || entry.status === 'late') {
                        report += `حفظ: ${entry.hifzLine} | مراجعة: ${entry.reviewLine} | تقييم: ${entry.rating}\n`;
                    }
                    report += `──────────────\n`;
                });
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                notify("تم نسخ التقرير بنجاح!");
            };

            // رأس رسمي موحّد لكل من تقرير الحلقة وكشف الطالب
            const ReportLetterhead = ({ title, subtitle }) => (
                <div className="avoid-break text-center pb-4 mb-4">
                    <div className="h-1 w-20 bg-gradient-to-l from-emerald-600 via-yellow-500 to-emerald-600 rounded-full mx-auto mb-3"></div>
                    <div className="flex items-center justify-center gap-3 mb-3">
                        <Logo size={54} />
                        <div className="text-right min-w-0">
                            <h2 className="font-black text-emerald-900 text-xl leading-tight">{settings.halakaName}</h2>
                            <div className="flex items-center gap-1.5 mt-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-yellow-500 shrink-0"></span>
                                <p className="text-[12px] text-emerald-700 font-black">بإشراف: {settings.teacherName}</p>
                            </div>
                        </div>
                    </div>
                    <div className="inline-flex items-center gap-1.5 bg-emerald-700 text-white px-5 py-1.5 rounded-full shadow-sm">
                        <Icon name="file-text" size={12} />
                        <h3 className="font-black text-[11px]">{title}</h3>
                    </div>
                    {subtitle && <p className="text-[10px] text-gray-400 mt-2 font-bold">{subtitle}</p>}
                    <div className="h-px bg-gradient-to-l from-transparent via-gray-200 to-transparent mt-4"></div>
                </div>
            );

            // صندوق إحصائية بحجم أكبر مخصص لقوالب التصدير العريضة (وليس لبطاقة الجوال الصغيرة)
            const ExportStatBox = ({ label, value, color, icon, sub }) => (
                <div className={`avoid-break rounded-2xl text-center ${color}`} style={{ padding: '16px 8px' }}>
                    {icon && <Icon name={icon} size={20} className="mx-auto mb-1 opacity-80" />}
                    <p className="text-[12px] font-bold opacity-80">{label}</p>
                    <p className="text-[30px] font-black leading-none mt-2">{value}</p>
                    {sub && <p className="text-[11px] font-bold opacity-80 mt-2">{sub}</p>}
                </div>
            );

            // إطار موحّد لكل الصور/PDF المُصدّرة: رأس بهوية التطبيق (الشعار + الاسم + الحلقة) ثم عنوان التقرير والمحتوى والتذييل
            const ExportFrame = ({ title, chip, periodText, children }) => (
                <div dir="rtl" className="bg-white" style={{ width: '840px', fontFamily: "'Tajawal','Noto Sans Arabic','Noto Kufi Arabic',sans-serif", lineHeight: 1.5, color: '#1f2937' }}>
                    <div style={{ padding: '14px' }}>
                        <div className="bg-white" style={{ border: '2px solid #047857', borderRadius: '26px', overflow: 'hidden' }}>

            const exportData = async () => {
                if (!students.length && !sessions.length && !transactions.length) return notify("لا توجد بيانات لتصديرها");
                try {
                    const core = { students, sessions, transactions, settings };
                    const dates = sessions.map(s => s.date).sort();
                    const payload = {
                        app: 'halaqati', format: 3, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
                        summary: { students: students.length, sessions: sessions.length, records: sessions.reduce((a, s) => a + s.records.length, 0), transactions: transactions.length, firstDate: dates[0] || null, lastDate: dates[dates.length - 1] || null },
                        checksum: hashStr(JSON.stringify(core)),
                        prefs: { theme },
                        ...core
                    };
                    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
                    const now = new Date();
                    const stamp = `${localDateKey(now)}_${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}`;
                    await shareFile(blob, `halaqati_backup_${stamp}.json`, 'application/json', 'نسخة احتياطية - حلقتي');

            const importData = (e) => {

                    try {

                        const trx = Array.isArray(p.transactions) ? p.transactions : [];
                        if (p.checksum && p.checksum !== hashStr(JSON.stringify({ students: p.students, sessions: ses, transactions: trx, settings: p.settings }))) {

                        autoSnapshot('restore');
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));

                        notify("تمت استعادة كل البيانات بتواريخها وتفاصيلها. سيعود التطبيق كما كان تماماً.");
                        setTimeout(() => window.location.reload(), 1300);
                    } catch (error) {
                        notify("حدث خطأ أثناء قراءة الملف.");
